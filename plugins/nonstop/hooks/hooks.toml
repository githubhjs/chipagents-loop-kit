# ChipAgents hooks for nonstop (Claude Code uses hooks.json instead).
# While nonstop mode is active, every agent turn end is a nudge that reruns
# the agent with the nonstop protocol, up to NONSTOP_MAX nudges.

# Upper bound on reruns per turn. A post_turn_restarts set earlier in the
# hierarchy (e.g. the project's .chipagents/hooks.toml) takes precedence.
post_turn_restarts = 20

[[post_turn]]
type = "bash"
command = 'bash "${CHIPAGENTS_PLUGIN_ROOT}/hooks/nonstop-chipagents.sh"'
blocking = true
enable_restarts = true
timeout = 30
