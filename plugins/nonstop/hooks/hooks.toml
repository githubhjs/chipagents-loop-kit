# ChipAgents hooks for nonstop (Claude Code uses hooks.json instead).
# While nonstop mode is active, every agent turn end is a nudge that reruns
# the agent with the nonstop protocol, up to NONSTOP_MAX nudges.

# post_turn_restarts below is very likely NOT what you get:
#   - measured: reruns = post_turn_restarts - 1 (the value counts attempts)
#   - the first value found while loading wins, so one in ~/.chipagents or in
#   the workspace beats this plugin's value
# Set the budget you want in the WORKSPACE .chipagents/hooks.toml.
post_turn_restarts = 21

[[post_turn]]
type = "bash"
command = 'bash "${CHIPAGENTS_PLUGIN_ROOT}/hooks/nonstop-chipagents.sh"'
blocking = true
enable_restarts = true
timeout = 30
