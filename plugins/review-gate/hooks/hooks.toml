# ChipAgents hooks for review-gate (Claude Code uses the turn-reviewer agent
# instead; there is no Claude hook here).
#
# This is a bash hook, NOT an agent hook, on purpose: an agent-type post_turn
# hook was measured (ChipAgents 0.42.3, 2026-10-19) to do nothing at all --
# validate parses it, but it never runs and nothing is rerun. review-gate.sh
# starts the reviewer itself and exits 1 to block. Off unless REVIEW_GATE=1 and
# REVIEW_GATE_PATHS are set. See docs/chipagents-hook-mechanics.md.
#
# post_turn_restarts below is very likely NOT what you get:
#   - measured: reruns = post_turn_restarts - 1 (the value counts attempts)
#   - the first value found while loading wins, so one in ~/.chipagents or in
#     the workspace beats this plugin's value
# To get N review rounds, set post_turn_restarts = N + 1 in the WORKSPACE
# .chipagents/hooks.toml.
post_turn_restarts = 6

[[post_turn]]
type = "bash"
command = 'bash "${CHIPAGENTS_PLUGIN_ROOT}/hooks/review-gate.sh"'
blocking = true
enable_restarts = true
timeout = 600
